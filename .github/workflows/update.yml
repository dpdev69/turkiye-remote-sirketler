name: Update list
on:
  schedule:
    - cron: '20 6 * * *'   # after Göçmeden's 05:00 UTC refresh and deploy
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update.mjs
      - name: Commit if changed
        run: |
          git add README.md data/companies.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name=dpdev69 -c user.email=4314475+dpdev69@users.noreply.github.com commit -m "Güncelleme $(date -u +%F)"
          git push
